<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configura els seients — Positius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="setup.css" />
</head>
<body>

  <div class="contenidor">

    <header>
      <h1>🪑 Configura els seients</h1>
      <div class="header-controls">
        <div class="selector-wrap">
          <label for="selector-grup-setup">Grup:</label>
          <select id="selector-grup-setup"></select>
        </div>
        <a href="alta.html" class="boto-nav">Alta</a>
        <a href="horari.html" class="boto-nav">Horari</a>
        <a href="index.html" class="boto-nav">Positius</a>
      </div>
    </header>

    <section class="targeta-grup">
      <div id="graella-setup" class="graella-aula graella-setup"></div>
    </section>

    <section id="banqueta" class="targeta-banqueta">
      <div class="banqueta-cap">
        <span class="banqueta-titol">Sense seient</span>
        <span class="banqueta-pista">
          Arrossega un nom fins a una taula, o torna un alumne aquí per alliberar-li el lloc.
        </span>
      </div>
      <div id="llista-banqueta" class="banqueta-llista"></div>
    </section>

    <section class="targeta-descarrega">
      <span id="comptador-pendents" class="comptador-pendents"></span>
      <div class="targeta-descarrega-botons">
        <button id="boto-esborrar-tot" type="button" class="boto-secundari">
          Esborra totes les assignacions
        </button>
        <button id="boto-descarregar-config" type="button" disabled>
          Descarrega seients.js ⭳
        </button>
      </div>
    </section>

  </div>

  <script src="dades.js"></script>
  <script src="seients.js"></script>
  <script src="setup.js"></script>
</body>
</html>

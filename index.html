<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Positius — Prototip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="contenidor">

    <header>
      <h1>➕ Positius</h1>
      <div class="header-controls">
        <div class="selector-wrap">
          <label for="selector-grup">Grup:</label>
          <select id="selector-grup"></select>
        </div>
        <div class="toggle-m2-wrap">
          <label class="toggle-m2-label" for="toggle-m2">
            <input type="checkbox" id="toggle-m2" />
            <span>Mode teclat (M2)</span>
          </label>
          <span id="indicador-m2" class="indicador-m2" aria-live="polite"></span>
        </div>
        <a href="alta.html" class="boto-nav">Alta</a>
        <a href="horari.html" class="boto-nav">Horari</a>
        <a href="setup.html" class="boto-nav">Setup</a>
      </div>
    </header>

    <section class="targeta-grup">
      <div class="targeta-grup-cap">
        <h2 id="titol-grup"></h2>
        <div class="selector-tram">
          <label for="selector-data">Dia:</label>
          <input type="date" id="selector-data" />
          <select id="selector-hora" aria-label="Franja horària del dia"></select>
          <button id="boto-avui" type="button" class="boto-avui">Avui</button>
        </div>
      </div>
      <p id="avis-tram" class="avis-tram" role="status" hidden></p>
      <div id="graella-aula" class="graella-aula"></div>
    </section>

    <section class="targeta-exportar">
      <h2>Baixada</h2>
      <div class="exportar-controls">
        <select id="selector-tram-exportar"></select>
        <button id="boto-exportar" type="button">Excel ⭳</button>
      </div>
    </section>

    <footer>
      Prototip amb dades inventades — cap alumne ni horari reals.
    </footer>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="dades.js"></script>
  <script src="seients.js"></script>
  <script src="horari.js"></script>
  <script src="positius.js"></script>
  <script src="exportar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dona d'alta un grup — Positius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="setup.css" />
  <link rel="stylesheet" href="alta.css" />
</head>
<body>

  <div class="contenidor">

    <header>
      <h1>📋 Dona d'alta un grup</h1>
      <div class="header-controls">
        <div class="selector-wrap">
          <label for="selector-grup-alta">Grup:</label>
          <select id="selector-grup-alta"></select>
        </div>
        <a href="setup.html" class="boto-nav">Setup</a>
        <a href="index.html" class="boto-nav">Positius</a>
      </div>
    </header>

    <section class="targeta-grup targeta-alta">

      <div class="alta-columna">
        <label for="text-alumnes" class="alta-etiqueta">
          Enganxa aquí la llista d'alumnes (un nom per línia, en l'ordre que vulguis)
        </label>
        <textarea
          id="text-alumnes"
          class="alta-textarea"
          rows="16"
          placeholder="Martina&#10;Youssef&#10;Laia&#10;Bruno&#10;…"
        ></textarea>
        <span id="avis-alta" class="alta-avis"></span>
      </div>

      <div class="alta-columna">
        <span id="etiqueta-previsualitzacio" class="alta-etiqueta">Previsualització</span>
        <ol id="previsualitzacio-alumnes" class="alta-previsualitzacio"></ol>
      </div>

    </section>

    <section class="targeta-descarrega">
      <span id="comptador-alta" class="comptador-pendents"></span>
      <div class="targeta-descarrega-botons">
        <button id="boto-descarregar-alumnes" type="button" disabled>
          Descarrega alumnes.js ⭳
        </button>
      </div>
    </section>

  </div>

  <script src="alumnes.js"></script>
  <script src="alta.js"></script>
</body>
</html>

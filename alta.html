<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alta de classe — Positius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="alta.css" />
</head>
<body>

  <div class="contenidor">

    <header>
      <h1>📋 Alta de classe</h1>
      <div class="header-controls">
        <div class="selector-wrap">
          <label for="selector-grup-alta">Grup:</label>
          <select id="selector-grup-alta"></select>
        </div>
        <a href="setup.html" class="boto-nav">Setup</a>
        <a href="index.html" class="boto-nav">Positius</a>
      </div>
    </header>

    <span id="estat-grup-actual" class="estat-grup-actual"></span>

    <section class="targeta-alta">
      <div class="columna-entrada">
        <h2>Enganxa la llista de noms</h2>
        <p class="alta-ajuda">Un alumne per línia, en l'ordre que vulguis.</p>
        <textarea
          id="textarea-noms"
          placeholder="Martina&#10;Youssef&#10;Laia&#10;Bruno&#10;…"
        ></textarea>
      </div>

      <div class="columna-previsualitzacio">
        <h2>Previsualització</h2>
        <span id="previsualitzacio-comptador" class="previsualitzacio-comptador"></span>
        <ol id="previsualitzacio-llista" class="previsualitzacio-llista"></ol>
      </div>
    </section>

    <section class="targeta-descarrega">
      <span class="avis-substitucio">
        Substitueix per complet la llista actual del grup. Després caldrà refer el Setup.
      </span>
      <button id="boto-descarregar-alumnes" type="button" disabled>
        Descarrega alumnes.js ⭳
      </button>
    </section>

  </div>

  <script src="alumnes.js"></script>
  <script src="alta.js"></script>
</body>
</html>
